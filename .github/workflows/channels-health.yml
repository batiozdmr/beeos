name: channels-health

on:
  schedule:
    - cron: "17 6 * * 1"   # Pazartesi sabah 06:17 UTC
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kanalları yokla
        id: probe
        run: |
          python tools/channels_health.py --json health.json | tee health.txt
          echo "broken=$(python -c 'import json;d=json.load(open("health.json"));print(sum(1 for c in d["channels"] if not c["ok"]))')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: channels-health
          path: |
            health.json
            health.txt
      - name: Kırık kanal varsa issue aç
        if: steps.probe.outputs.broken != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('health.json','utf8'));
            const bad = data.channels.filter(c => !c.ok);
            const body = ['Haftalık kanal sağlık kontrolü kırık yayın buldu:', '', ...bad.map(c => `- **${c.name}** (${c.group}) — HTTP ${c.status||0} — ${c.url}`)].join('\n');
            await github.rest.issues.create({ ...context.repo, title: `Kırık kanallar (${bad.length}) — ${new Date().toISOString().slice(0,10)}`, body, labels: ['channels','auto'] });
